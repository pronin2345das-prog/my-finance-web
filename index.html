<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Аналитика</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--tg-theme-bg-color, #f4f4f5);
            color: var(--tg-theme-text-color, #000);
            padding: 20px;
            margin: 0;
        }
        .card {
            background-color: var(--tg-theme-secondary-bg-color, #fff);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .ai-advice {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        h2 { margin-top: 0; font-size: 18px; margin-bottom: 15px; }
        
        select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border-radius: 10px;
            border: 1px solid #ccc;
            margin-bottom: 15px;
            background-color: var(--tg-theme-bg-color, #fff);
            color: var(--tg-theme-text-color, #000);
        }

        .stat-row { margin-bottom: 15px; }
        .stat-header { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; }
        .bar-bg { background-color: #e0e0e0; border-radius: 8px; height: 10px; width: 100%; overflow: hidden; }
        .bar-fill { background-color: #ff3b30; height: 100%; border-radius: 8px; transition: width 0.3s; }
        .income-text { color: #34c759; font-size: 24px; font-weight: bold; margin-bottom: 5px;}
        .empty-state { text-align: center; color: #888; font-style: italic; }
    </style>
</head>
<body>

    <select id="monthSelector" onchange="changeMonth()"></select>

    <div class="card ai-advice">
        <h2>🤖 Анализ месяца</h2>
        <p id="adviceText">Загрузка данных...</p>
    </div>

    <div class="card">
        <h2>Поступления</h2>
        <div class="income-text" id="incomeText">0 ₽</div>
    </div>

    <div class="card">
        <h2>Расходы:</h2>
        <div id="expensesList"></div>
    </div>

    <script>
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();

        let appData = {};

        const monthNames = {
            "01": "Январь", "02": "Февраль", "03": "Март", "04": "Апрель",
            "05": "Май", "06": "Июнь", "07": "Июль", "08": "Август",
            "09": "Сентябрь", "10": "Октябрь", "11": "Ноябрь", "12": "Декабрь"
        };

        function formatMonth(dateStr) {
            const parts = dateStr.split("-");
            return monthNames[parts[1]] + " " + parts[0];
        }

        const urlParams = new URLSearchParams(window.location.search);
        const rawData = urlParams.get('data');

        if (rawData) {
            appData = JSON.parse(decodeURIComponent(rawData));
            
            const selector = document.getElementById('monthSelector');
            for (let monthStr in appData.history) {
                let option = document.createElement("option");
                option.value = monthStr;
                option.text = formatMonth(monthStr);
                selector.appendChild(option);
            }

            renderDashboard(appData.latest_month);
        } else {
            document.getElementById('adviceText').innerText = "Здесь появятся ваши графики, когда вы запросите /stats в боте.";
        }

        function changeMonth() {
            const selectedMonth = document.getElementById('monthSelector').value;
            renderDashboard(selectedMonth);
        }

        function renderDashboard(monthKey) {
            const data = appData.history[monthKey];
            
            if (monthKey === appData.latest_month) {
                document.getElementById('adviceText').innerText = appData.advice;
            } else {
                document.getElementById('adviceText').innerText = "Архивная запись (советы ИИ даются только для текущего месяца).";
            }

            document.getElementById('incomeText').innerText = "+ " + data.income + " ₽";

            const expensesContainer = document.getElementById('expensesList');
            expensesContainer.innerHTML = "";
            
            let totalExpenses = 0;
            for (let cat in data.expenses) { totalExpenses += data.expenses[cat]; }

            if (totalExpenses === 0) {
                expensesContainer.innerHTML = "<p class='empty-state'>В этом месяце трат не было.</p>";
                return;
            }

            for (let cat in data.expenses) {
                let amount = data.expenses[cat];
                let percent = (amount / totalExpenses) * 100;

                expensesContainer.innerHTML += `
                    <div class="stat-row">
                        <div class="stat-header">
                            <span>${cat}</span>
                            <strong>${amount} ₽</strong>
                        </div>
                        <div class="bar-bg">
                            <div class="bar-fill" style="width: ${percent}%;"></div>
                        </div>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
